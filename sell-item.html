<ma>

        <div class="hero-logo">
            Zoober
        </div>
        <nav class="nav-links">
             <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="index.html#about">About</a></li>
                 <li><a href="contact.html">Contact</a></li>
        </ul>
        </nav>
    </header>
<main>
<section class="sell-section">
    <div class="sell-container">
        <h2>Post Your Item on Zoober</h2>
        <form id="sell-form">
            <div class="form-group">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" placeholder="Enter product name..." required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="furniture">Furniture</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="4" placeholder="Tell us about your item..."></textarea>
            </div>

            <div class="form-group">
                <label for="file">Upload Photo</label>
                <input type="file" id="file" accept="image/*">
            </div>

            <button type="submit" class="submit-btn">Submit Listing</button>
        </form>
    </div>
</section>
</main>

</body>
